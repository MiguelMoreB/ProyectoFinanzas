<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Bolsillo</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Encabezado ===== -->
  <header class="topbar">
    <button class="month-nav" id="prevMonth" aria-label="Mes anterior">‹</button>
    <h1 id="monthLabel">Mes</h1>
    <button class="month-nav" id="nextMonth" aria-label="Mes siguiente">›</button>
  </header>

  <!-- ===== Contenido (cambia según la pestaña) ===== -->
  <main id="view"></main>

  <!-- ===== Botón flotante para agregar ===== -->
  <button class="fab" id="fab" aria-label="Agregar movimiento">+</button>

  <!-- ===== Barra de pestañas inferior ===== -->
  <nav class="tabbar">
    <button class="tab active" data-tab="inicio">
      <span class="tab-ico">🏠</span><span>Inicio</span>
    </button>
    <button class="tab" data-tab="historial">
      <span class="tab-ico">📊</span><span>Historial</span>
    </button>
    <button class="tab" data-tab="metas">
      <span class="tab-ico">🎯</span><span>Metas</span>
    </button>
    <button class="tab" data-tab="ajustes">
      <span class="tab-ico">⚙️</span><span>Ajustes</span>
    </button>
  </nav>

  <!-- ===== Modal para agregar / editar movimiento ===== -->
  <div class="modal-bg" id="modalBg" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
